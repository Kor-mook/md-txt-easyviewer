const $=id=>document.getElementById(id), files=new Map(), urls=new Map(), folderStates=new Map(); let root='', current='', history=[], desktopMode=false, desktopDirectories=[], desktopCanUp=false, lastContent=null, searchAll=false, forceOriginal=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>{const out=[];for(const part of s.split('/')){if(!part||part==='.')continue;if(part==='..'){if(out.length&&out[out.length-1]!=='..')out.pop();else out.push('..')}else out.push(part)}return out.join('/')};
function pathFor(link){let p=link.split('#')[0].split('?')[0];try{p=decodeURIComponent(p)}catch{}return norm((current.includes('/')?current.slice(0,current.lastIndexOf('/')+1):'')+p)}
function hrefFor(raw,image=false){const link=raw.trim();if(!link||/[\x00-\x1f]/.test(link))return '';if(link.startsWith('#'))return image?'':link;if(/^(https?:|mailto:)/i.test(link))return image?'':link;if(/^[a-z][a-z0-9+.-]*:/i.test(link)||link.startsWith('//')||link.startsWith('/'))return '';const path=pathFor(link);if(image){const f=files.get(path);if(!f||!/^image\/(png|jpeg|gif|webp|bmp|avif)$/i.test(f.type))return '';if(f.url)return f.url;if(!urls.has(path))urls.set(path,URL.createObjectURL(f));return urls.get(path)}return files.has(path)?'#local:'+encodeURIComponent(path)+(link.includes('#')?'#'+encodeURIComponent(link.split('#').slice(1).join('#')):''):''}
function escapeMarkdownText(s){return esc(s).replace(/&amp;(#(?:[xX][0-9a-fA-F]{1,8}|[0-9]{1,8})|[A-Za-z][A-Za-z0-9]{1,31});/g,'&$1;')}
function inline(s){let tokens=[];const hold=x=>`\u0001${tokens.push(x)-1}\u0002`;s=s.replace(/(?<!\\)`([^`]+)(?<!\\)`/g,(_,x)=>hold('<code>'+esc(x)+'</code>'));s=s.replace(/(?<!\\)\$\$([^$\n]+)\$\$/g,(_,x)=>hold(renderMath(x,true)));s=s.replace(/(?<![\\$])\$(?![$\s])([^$\n]*?[^\\\s$])\$(?![$\d])/g,(_,x)=>hold(renderMath(x)));s=s.replace(/\\([!"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~])/g,(_,x)=>hold(esc(x)));s=s.replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+"[^"]*")?\)/g,(_,alt,url)=>{const src=hrefFor(url,true);return hold(src?'<img src="'+esc(src)+'" alt="'+esc(alt)+'">':esc(alt)+' ('+esc(t('image_missing'))+')')});s=s.replace(/\[([^\]]+)\]\(([^\s)]+)(?:\s+"[^"]*")?\)/g,(_,label,url)=>{const href=hrefFor(url);return hold(href?'<a href="'+esc(href)+'"'+(/^(https?:|mailto:)/i.test(href)?' target="_blank" rel="noopener noreferrer"':'')+'>'+escapeMarkdownText(label)+'</a>':escapeMarkdownText(label))});s=escapeMarkdownText(s).replace(/\*\*([^*]+)\*\*|__([^_]+)__/g,'<strong>$1$2</strong>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/\*([^*]+)\*|_([^_]+)_/g,'<em>$1$2</em>');return s.replace(/\u0001(\d+)\u0002/g,(_,i)=>tokens[+i])}
function render(md){const lines=md.replace(/\r\n?/g,'\n').split('\n');let out=[],i=0;const special=s=>/^\s*(?:\$\$|#{1,6}\s|```|~~~|>|[-+*]\s|\d+[.)]\s|(?:---+|\*\*\*+)\s*$)/.test(s);while(i<lines.length){let l=lines[i];if(!l.trim()){i++;continue}let m;if((m=l.match(/^\s*(```+|~~~+)(.*)$/))){const fence=m[1],buf=[];i++;while(i<lines.length&&!lines[i].trimStart().startsWith(fence))buf.push(lines[i++]);if(i<lines.length)i++;out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue}if(/^\s*\$\$/.test(l)){const begin=l.indexOf('$$'),rest=l.slice(begin+2),end=rest.indexOf('$$');let math='',next=i+1,closed=false;if(end>=0&&rest.slice(end+2).trim()===''){math=rest.slice(0,end);closed=true}else if(end<0){const buf=[rest];while(next<lines.length){const close=lines[next].indexOf('$$');if(close>=0&&lines[next].slice(close+2).trim()===''){buf.push(lines[next].slice(0,close));closed=true;next++;break}buf.push(lines[next++])}math=buf.join('\n')}if(closed){out.push('<div class="math-block">'+renderMath(math.trim(),true)+'</div>');i=end>=0?i+1:next;continue}}if((m=l.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/))){let t=m[2],id=t.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s+/g,'-');out.push('<h'+m[1].length+' id="'+esc(id)+'">'+inline(t)+'</h'+m[1].length+'>');i++;continue}if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){out.push('<hr>');i++;continue}if(/^\s*>/.test(l)){let b=[];while(i<lines.length&&/^\s*>/.test(lines[i]))b.push(lines[i++].replace(/^\s*>\s?/,''));out.push('<blockquote>'+render(b.join('\n'))+'</blockquote>');continue}if(i+1<lines.length&&l.includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(y=>y.trim());let heads=cells(l);i+=2;let rows=[];while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())rows.push(cells(lines[i++]));out.push('<table><thead><tr>'+heads.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+heads.map((_,j)=>'<td>'+inline(r[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}if((m=l.match(/^\s*([-+*]|\d+[.)])\s+(.+)$/))){let ordered=/\d/.test(m[1]),items=[];while(i<lines.length&&(m=lines[i].match(/^\s*([-+*]|\d+[.)])\s+(.+)$/))&&/\d/.test(m[1])===ordered){let v=m[2],check=v.match(/^\[([ xX])\]\s*/);if(check)v=(check[1].toLowerCase()==='x'?'☑ ':'☐ ')+v.slice(check[0].length);items.push('<li>'+inline(v)+'</li>');i++}let tag=ordered?'ol':'ul';out.push('<'+tag+'>'+items.join('')+'</'+tag+'>');continue}let p=[l];i++;while(i<lines.length&&lines[i].trim()&&!special(lines[i])&&!(i+1<lines.length&&lines[i].includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])))p.push(lines[i++]);out.push('<p>'+p.map(inline).join('<br>')+'</p>')}return out.join('\n')}
function drawTree(){if(desktopMode&&searchAll&&$('search').value.trim()){renderIndexResults();return}const query=$('search').value.toLowerCase(),paths=[...files.keys()].filter(p=>/\.(md|markdown|mdown|txt)$/i.test(p)&&p.toLowerCase().includes(query)).sort((a,b)=>a.localeCompare(b,'ko'));if(desktopMode){const visiblePaths=paths.filter(p=>!p.includes('/'));const dirs=desktopDirectories.filter(d=>d.toLowerCase().includes(query)).sort((a,b)=>a.localeCompare(b,'ko'));$('tree').innerHTML=(desktopCanUp?'<button class="file" data-parent="1">📁 ..</button>':'')+dirs.map(d=>'<button class="file" data-dir="'+esc(d)+'">📁 '+esc(d)+'</button>').join('')+visiblePaths.map(p=>'<button class="file'+(p===current?' active':'')+'" data-path="'+esc(p)+'">📄 '+esc(p)+'</button>').join('')+(!dirs.length&&!visiblePaths.length?'<div class="empty-list">'+esc(t('no_items'))+'</div>':'');return}const tree={dirs:new Map(),files:[]};for(const path of paths){let parts=path.split('/'),name=parts.pop(),node=tree;for(const part of parts){if(!node.dirs.has(part))node.dirs.set(part,{dirs:new Map(),files:[]});node=node.dirs.get(part)}node.files.push({path,name})}function nodeHtml(node,parent=''){return [...node.dirs].map(([name,child])=>{const path=parent?parent+'/'+name:name,key=root+'/'+path;return '<details data-folder="'+esc(key)+'"'+(folderStates.get(key)===false?'':' open')+'><summary>'+esc(name)+'</summary><div class="children">'+nodeHtml(child,path)+'</div></details>'}).join('')+node.files.map(f=>'<button class="file'+(f.path===current?' active':'')+'" data-path="'+esc(f.path)+'">📄 '+esc(f.name)+'</button>').join('')} $('tree').innerHTML=paths.length?nodeHtml(tree):'<div class="empty-list">'+esc(t(files.size?'no_docs':'no_open_folder'))+'</div>'}
async function openFile(path,record=true,anchor='',newTab=false){const file=files.get(path);if(!file)return;if(current!==path)forceOriginal=false;if(record&&current&&current!==path)history.push(current);current=path;drawTree();try{let content=await file.text();if(current!==path)return;lastContent=content;registerDocument(path,newTab);if(desktopMode&&!/\.txt$/i.test(path)){const links=[...content.matchAll(/!?\[[^\]]*\]\(([^\s)]+)(?:\s+"[^"]*")?\)/g)].map(m=>m[1]);await Promise.all(links.map(async link=>{if(link.startsWith('#')||/^[a-z][a-z0-9+.-]*:/i.test(link)||link.startsWith('/')||files.has(pathFor(link)))return;try{const r=await fetch('resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base:path,link})});if(!r.ok)return;const f=await r.json(),url='file/'+f.id;files.set(pathFor(link),{type:f.type,url,text:()=>fetch(url).then(x=>{if(!x.ok)throw Error(t('read_error').trim());return x.text()})})}catch{}}));if(current!==path)return}$('main').innerHTML='<div class="document'+(/\.txt$/i.test(path)?' text-document':'')+'"><div class="path">'+esc(absoluteDocument(path))+'</div><article'+(forceOriginal?' translate="no"':'')+'>'+(/\.txt$/i.test(path)?'<pre class="plain-text"><code>'+esc(content)+'</code></pre>':render(content))+'</article></div>';$('main').scrollTop=0;if(anchor){const el=document.getElementById(anchor);if(el)el.scrollIntoView()}}catch(e){$('main').innerHTML='<div class="welcome error">'+esc(t('read_error'))+esc(e.message)+'</div>'}}

$('search').addEventListener('input',()=>scheduleIndexSearch());$('searchScope').addEventListener('click',async()=>{if(!desktopMode)return;const next=!searchAll;try{const r=await fetch('search-mode',{method:'POST',body:next?'index':'folder'});if(!r.ok)throw Error();searchAll=next;updateSearchLabel();scheduleIndexSearch()}catch{alert(t('search_save_error'))}});$('tree').addEventListener('click',e=>{const summary=e.target.closest('summary');if(summary){const d=summary.parentElement;folderStates.set(d.dataset.folder,!d.open);return}const b=e.target.closest('[data-path]');if(b)openFile(b.dataset.path,true,'',e.ctrlKey||e.metaKey)});function applyTheme(dark){document.body.classList.toggle('dark',dark);const label=t(dark?'dark_off':'dark_on');$('theme').textContent=dark?'☀':'☾';$('theme').title=label;$('theme').setAttribute('aria-label',label);$('enableDark').checked=dark;localStorage.setItem('md-viewer-theme',dark?'dark':'light')}$('theme').addEventListener('click',()=>applyTheme(!document.body.classList.contains('dark')));$('main').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const h=a.getAttribute('href');if(h.startsWith('#local:')){e.preventDefault();let [p,anchor]=h.slice(7).split('#');openFile(decodeURIComponent(p),true,anchor?decodeURIComponent(anchor):'')}else if(h.startsWith('#')){e.preventDefault();let el=document.getElementById(decodeURIComponent(h.slice(1)));if(el)el.scrollIntoView()}});

$('editorCancel').onclick=()=>$('editorDialog').close();$('editorConfirm').onclick=async()=>{const editor=$('editorSelect').value,remember=$('rememberEditor').checked;if(!editor&&(editorMode!=='settings'||remember)){alert(t('editor_required'));return}const button=$('editorConfirm');button.disabled=true;try{if(editorMode==='settings'){const r=await fetch('set-editor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({editor,remember,tabs:$('enableTabs').checked,indexSearch:$('enableIndexSearch').checked,dark:$('enableDark').checked,language:$('languageSelect').value})});if(!r.ok)throw Error();await applyLocale($('languageSelect').value);applyTheme($('enableDark').checked);const nextTabs=$('enableTabs').checked;if(nextTabs!==tabsEnabled)openTabs=activeDocument?[activeDocument]:[];tabsEnabled=nextTabs;searchAll=$('enableIndexSearch').checked;updateSearchLabel();scheduleIndexSearch();updateNavigation()}else await launchEditor(editor,remember);$('editorDialog').close()}catch(error){alert(t(error.messageKey||'editor_save_error'))}finally{button.disabled=false}};
if(location.protocol.startsWith('http'))editorList().then(async data=>{tabsEnabled=Boolean(data.tabs);searchAll=Boolean(data.indexSearch);applySidebarWidth(data.sidebarWidth||240);setSidebarCollapsed(Boolean(data.sidebarCollapsed));try{await applyLocale(data.language||'en')}catch{messages=englishFallback;selectedLanguage='en';localizeUI()}applyTheme(Boolean(data.dark));updateNavigation();tutorialPending=Boolean(data.tutorialNeeded);tutorialLocaleReady=true;maybeStartTutorial()}).catch(()=>{messages=englishFallback;selectedLanguage='en';localizeUI()});else {localizeUI();if(localStorage.getItem('md-viewer-theme')==='dark')applyTheme(true)};$('theme').addEventListener('click',async()=>{if(!desktopMode)return;const dark=document.body.classList.contains('dark');try{const response=await fetch('theme',{method:'POST',body:dark?'dark':'light'});if(!response.ok)throw Error()}catch{applyTheme(!dark);alert(t('theme_save_error'))}});
setInterval(async()=>{if(!desktopMode||!current||document.hidden||lastContent===null)return;const path=current,file=files.get(path);if(!file)return;try{const text=await file.text();if(path===current&&file===files.get(path)&&text!==lastContent){const scroll=$('main').scrollTop;await openFile(path,false);if(path===current)$('main').scrollTop=scroll}}catch{}},2000);
</script></body></html>
